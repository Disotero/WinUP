name: Сборка .exe

# Собирает .exe-лаунчеры на Windows-раннере GitHub.
# Вручную (Actions → Run workflow) — кладёт .exe в артефакты запуска.
# По тегу vX.Y.Z — собирает и выкладывает .exe в Releases.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Папка версии (например 0.1.1)"
        required: true
        default: "0.1.1"
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Определить версию и путь
        id: ver
        shell: pwsh
        run: |
          if ("$env:GITHUB_REF" -like 'refs/tags/*') { $v = "$env:GITHUB_REF".Replace('refs/tags/v','') }
          else { $v = "${{ github.event.inputs.version }}" }
          "version=$v"            >> $env:GITHUB_OUTPUT
          "dir=$v/windows-setup"  >> $env:GITHUB_OUTPUT

      - name: Собрать .exe (PS2EXE)
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module ps2exe -Scope CurrentUser -Force
          Import-Module ps2exe
          $root = "${{ steps.ver.outputs.dir }}"
          $sys  = "$root/system"
          # Версия .exe — единый источник: system/version.txt (его же читает локальный build-exe.ps1)
          $pv   = (Get-Content "$sys/version.txt" -TotalCount 1).Trim() + '.0'
          Invoke-ps2exe -inputFile "$sys/launcher-setup.ps1"    -outputFile "$root/Настройка Windows.exe" `
              -iconFile "$sys/icon.ico"    -requireAdmin -noConsole -noOutput -noError -title 'WinUP'          -company 'DISOTERO' -product 'WinUP' -version $pv
          Invoke-ps2exe -inputFile "$sys/launcher-transfer.ps1" -outputFile "$root/Перенос данных.exe" `
              -iconFile "$sys/icon-db.ico" -requireAdmin -noConsole -noOutput -noError -title 'Перенос данных' -company 'DISOTERO' -product 'WinUP' -version $pv
          if (-not (Test-Path "$root/Настройка Windows.exe")) { throw "Настройка Windows.exe не собрался" }
          if (-not (Test-Path "$root/Перенос данных.exe"))    { throw "Перенос данных.exe не собрался" }

      - name: Упаковать архив (весь каталог)
        shell: pwsh
        run: |
          # Лаунчеры (.exe/.bat) ищут system\*.ps1 рядом с собой, поэтому в релиз кладём ВЕСЬ
          # каталог windows-setup (.bat + .exe + system\), а не голые .exe — иначе «Не найден файл».
          Compress-Archive -Path "${{ steps.ver.outputs.dir }}" -DestinationPath "WinUP-${{ steps.ver.outputs.version }}.zip" -Force

      - name: Артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: WinUP-${{ steps.ver.outputs.version }}
          path: WinUP-${{ steps.ver.outputs.version }}.zip

      - name: Выложить в Releases (по тегу)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Только архив: голый .exe без папки system\ не запускается, а GitHub ещё и вырезает
          # кириллицу из имён ассетов («Настройка Windows.exe» → «Windows.exe»). Всё в zip.
          files: WinUP-${{ steps.ver.outputs.version }}.zip
